apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: baseapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/your-repo.git
    targetRevision: main
    path: spring-kafka-postgres-app/k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: baseapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
