services:
  gexable-esg-demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gexable-esg-demo
    ports:
      - "8000:8000"
    environment:
      GEXABLE_SECRET_KEY: "local-demo-secret"
      GEXABLE_DEBUG: "true"
      GEXABLE_ALLOWED_HOSTS: "localhost,127.0.0.1,host.docker.internal"
      GEXABLE_DB_NAME: "/data/gexable_esg.sqlite3"
    volumes:
      - gexable_esg_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  gexable_esg_data:
