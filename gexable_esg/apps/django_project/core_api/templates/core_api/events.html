{% extends "core_api/base.html" %}
{% block content %}
<h1>Event Stream</h1>
<div class="card"><button id="refresh">Refresh Events</button></div>
<div class="card"><pre id="out"></pre></div>
<script>
const out=document.getElementById('out');
async function refresh(){const r=await fetch('/api/v1/audit/events'); out.textContent=JSON.stringify(await r.json(),null,2);} 
refresh();
document.getElementById('refresh').onclick=refresh;
</script>
{% endblock %}
